name: Feature request
description: Suggest something this project doesn't do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd want the feature to actually do. Doesn't need to be a full spec.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you're using today, or other tools that do this.
    validations:
      required: false
