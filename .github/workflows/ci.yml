name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (this repo's packageManager) itself requires Node
          # >=22.13 to run at all (uses node:sqlite internally) - this isn't
          # about what the app needs, pnpm literally crashes with
          # ERR_UNKNOWN_BUILTIN_MODULE on Node 20, confirmed live in this
          # workflow before this was fixed.
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
