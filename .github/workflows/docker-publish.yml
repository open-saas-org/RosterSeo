name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image path is lowercase (GHCR/OCI requirement) - "rosterseo",
          # not the "seo" repo slug. The image.title label below carries
          # the real "RosterSEO" casing since labels aren't path-restricted.
          images: ghcr.io/${{ github.repository_owner }}/rosterseo
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=RosterSEO
            org.opencontainers.image.description=Open-source SEO + AI-search-visibility platform. Self-hostable via Docker or Railway.

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
