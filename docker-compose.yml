services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rosterseo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Restricted role - see packages/db/README.md for why RLS depends on
      # this NOT being the postgres superuser.
      DATABASE_URL: postgres://rosterseo_app:rosterseo_dev@postgres:5432/rosterseo
      # Elevated role, migrations only - the image's own entrypoint
      # (docker/docker-entrypoint.sh) runs migrations automatically against
      # this on every `docker compose up`/container start, before the web
      # server starts. Nothing to run manually.
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@postgres:5432/rosterseo
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://rosterseo_app:rosterseo_dev@postgres:5432/rosterseo

volumes:
  postgres_data:
