# Railway build config for the web service. Railway's own managed Postgres
# plugin should be attached separately (Railway dashboard -> New -> Database
# -> PostgreSQL); it sets DATABASE_URL automatically via a reference variable.
# See docker/RAILWAY.md for the one-click-template publishing steps.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Starts the docs app (apps/docs) as a second, internal-only process on
# 3001 before the real web server - same reasoning as
# docker/docker-entrypoint.sh's identical two-line pattern, which this
# bypasses entirely (Railway ignores that script when startCommand is
# set). apps/web's own next.config.mjs rewrites /docs/* to that internal
# port, so Railway only ever needs the one public port/domain it already
# assigns to this service.
startCommand = "sh -c 'PORT=3001 HOSTNAME=0.0.0.0 node apps/docs/server.js & exec node apps/web/server.js'"
# Runs once, before traffic is switched to the new deploy - real Drizzle
# migrations against DATABASE_URL (or DATABASE_MIGRATE_URL when set), via
# the bundled packages/db/dist/migrate.mjs the Dockerfile's build stage
# produces (see packages/db/package.json's "build" script) - not a CLI/
# dev-tool dependency, so this runs fine from the lean runner image. Real,
# verified end-to-end locally (bundled build + run from the same relative
# path this command uses) before being added here. Without this, a fresh
# template deploy comes up against an empty, unmigrated database.
releaseCommand = "node packages/db/dist/migrate.mjs"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
